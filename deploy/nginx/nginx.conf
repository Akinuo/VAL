worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

  # Compose DNS returns every replica; re-resolve so scaling up/down is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Per-client-IP limits. These live at the LB so they hold across replicas
  # (the in-app feedback limiter is per-instance only).
  limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=feedback:10m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  upstream bmo_app {
    zone bmo_app 64k;
    least_conn;
    server app:3000 resolve max_fails=3 fail_timeout=10s;   # passive health checks
    keepalive 32;
  }

  server {
    listen 80;
    client_max_body_size 16k;
    limit_conn perip 40;

    # Terminate TLS at your cloud LB / Cloudflare / certbot sidecar and forward
    # here; HSTS and the rest of the security headers are set by the app itself.
    location = /api/feedback {
      limit_req zone=feedback burst=3 nodelay;
      include /etc/nginx/proxy.conf;
    }
    location / {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/proxy.conf;
    }
  }
}
